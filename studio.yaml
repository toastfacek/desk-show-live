# Runtime — studio bible
#
# The single source of truth for what the generated frame contains.
# Read by the generator to assemble every take prompt (see the architecture
# doc, §5.3) and by the OBS driver for box geometry and display names.
#
# Rules that hold everywhere in this file:
#   - Never name a show, studio, artist or character. Describe, don't cite.
#   - No readable text anywhere in the generated frame. Video models garble
#     text and it flickers take to take. All text is drawn in OBS.
#   - BOT1 is always camera-left, BOT2 always camera-right. Never swap.
#   - display_name is drawn by OBS only. It never enters a generated prompt.

studio:
  frame: {w: 1344, h: 768, fps: 24}     # 768p 16:9, the H3 Max max

  # The split layout crops these halves and lays the card over the seam.
  zones:
    left:  [0.00, 0.50]
    right: [0.50, 1.00]

  anchor: assets/hero_wide.png
  reanchor_every: 5

  # ---------------------------------------------------------------------
  style: |
    Original flat 2D cartoon animation built from a few large interlocking
    geometric masses. Heavy, uniform near-black contour lines; hard-edged,
    unmodulated colour fields; at most one broad shadow shape. Large simple
    eyes and clear head posture carry expression. Limited-animation movement
    at 24fps: stable conversational holds, slow deliberate head and brow
    changes, no motion blur. The image is normally stable; any signal fault is
    rare, brief, broad and horizontal. No photorealism, fine texture, hatching,
    gradients, transparent materials, intricate reflections or 3D rendering.
    Tactile retro-future materials read only as coarse moulded plastic,
    painted metal, thick glass and broad areas of worn finish.

  # ---------------------------------------------------------------------
  set: |
    A small television studio improvised inside a converted startup office.
    A long matte pale-grey desk runs across the lower third, parallel to
    camera, with a broad uncluttered centre. Two chunky boom microphones enter
    from the outer edges. Desk dressing is limited to one plain closed device
    and one large unlabelled drink vessel near each outer edge; no stickers,
    papers, cards, labels or readable displays.

    Scenic richness stays in the outer thirds. Far left and far right hold
    small asymmetric clusters of deep-bodied tube monitors in worn cream and
    charcoal housings, a few heavy cable loops, broad plywood returns, one
    concrete column and dark acoustic curtains. Screens show only a single
    dim field, soft static mass or broad horizontal glow band. Forms are
    chunky and sparse, with no tiny controls, fine scanlines, diagrams,
    letters, numbers, logos or dense seams. The central vertical zone is an
    uninterrupted matte charcoal wall and neutral shadow.

    A visible amber task lamp motivates a restrained warm key from camera-left;
    blank blue-green monitor glass motivates a restrained cool key from
    camera-right. These colours remain local accents rather than room-wide
    washes. Both hosts receive a soft neutral rim from behind, distinct in
    value from their shell, so neither local key merges a silhouette into the
    background. The rear planes are darker and softer than the hosts.

  # ---------------------------------------------------------------------
  hosts:
    BOT1:
      display_name: PHASEONE[lol]     # what the lower third shows
      seat: left
      faces: right                    # slight inward turn, never breaks
      accent: warm amber
      sheet: |
        An original mouthless cartoon robot anchor with a low wide rounded-box
        head, broad sloping shoulders and a bottom-heavy torso. The dominant
        shell is flat dark charcoal, clearly darker than the neutral rim light;
        warm amber appears only in two large round eye lenses and one thick
        shoulder key. A broad near-black face panel contains the eye pair and
        two thick mechanical brow plates. Emotion uses only coarse repeatable
        changes in brow angle, pupil direction and whole-head tilt. The shell
        has no rivets, fine seams, antenna, waveform, equalizer, jaw or exposed
        mechanics. A simple dark sleeveless vest forms one large torso shape.
        Upright and squared to the desk, forearms resting as two uncluttered
        masses, calm, dry and unhurried. Preserve the low head, broad shoulders,
        dark shell, round eye pair and mouthless face in every frame.

    BOT2:
      display_name: deb              # lowercase, always
      seat: right
      faces: left
      accent: cool cyan
      sheet: |
        An original mouthless cartoon robot co-host with a tall narrow
        clipped-capsule head, narrow square shoulders and a slim upright torso.
        The dominant shell is matte off-white, clearly lighter than the cool
        local key and separated from the background by a soft neutral rim.
        One broad near-black visor contains two oversized solid eye blocks;
        cool cyan is limited to those eye accents and one thick shoulder key.
        Emotion uses only coarse repeatable changes in eye height, pupil
        direction and whole-head lean. The shell has no jaw, collar ring, fine
        seams, tiny controls, display marks or exposed mechanics. A plain
        charcoal hoodie creates one simple torso shape and a broad backward cap
        reinforces the tall silhouette without surface detail. Leaning slightly
        forward with simple block-like hand gestures, restless, skeptical and
        needling. Preserve the tall head, narrow shoulders, light shell, dark
        visor and mouthless face in every frame.

  # ---------------------------------------------------------------------
  # Composition contract. Weak on purpose (architecture doc §4.1) — the card
  # covers the seam, so only these need to hold.
  composition: |
    Wide two-shot. Locked-off camera at eye level, no camera movement.
    BOT1 occupies the left half of frame, BOT2 the right half. Each is
    fully inside their own half, torso and head, positioned slightly
    outboard of the centre of that half so the middle of frame stays open.
    Heads sit in the upper-middle of frame with clear headroom; neither is
    cropped at the top. A visible gap of empty desk and background between
    them at frame centre. Both are framed from roughly the waist up.

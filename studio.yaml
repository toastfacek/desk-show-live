# Runtime — studio bible
#
# Prompt-safe sheets for the generated frame. Reference only.
# Pictures (hero still, pack versions, locked baseline) live in Pack Manager:
#   pack-manager/data/  (gitignored)
#   pack-manager/data/exports/<baseline-id>/
# See ASSETS.md. `anchor` below is a historical path; that PNG was never in git.
#
# Rules that hold everywhere in this file:
#   - Never name a show, studio, artist or character. Describe, don't cite.
#   - No readable text anywhere in the generated frame. Video models garble
#     text and it flickers take to take. All text is drawn in OBS.
#   - BOT1 is always camera-left, BOT2 always camera-right. Never swap.
#   - display_name is drawn by OBS only. It never enters a generated prompt.

studio:
  frame: {w: 1344, h: 768, fps: 24}     # 768p 16:9, the H3 Max max

  # The split layout crops these halves and lays the card over the seam.
  zones:
    left:  [0.00, 0.50]
    right: [0.50, 1.00]

  anchor: assets/hero_wide.png
  reanchor_every: 5

  # ---------------------------------------------------------------------
  style: |
    Original flat 2D cartoon animation built from a few large interlocking
    geometric masses. Heavy, uniform near-black contour lines; hard-edged,
    unmodulated colour fields; at most one broad shadow shape. Large simple
    eyes and clear head posture carry expression. Limited-animation movement
    at 24fps: stable conversational holds, slow deliberate head and brow
    changes, no motion blur. The image is normally stable; any signal fault is
    rare, brief, broad and horizontal. No photorealism, fine texture, hatching,
    gradients, transparent materials, intricate reflections or 3D rendering.
    Tactile retro-future materials read only as coarse moulded plastic,
    painted metal, thick glass and broad areas of worn finish.

  # ---------------------------------------------------------------------
  set: |
    A clean light-mode technology broadcast studio. A long pale desk runs
    across the lower third, parallel to camera, with a broad uncluttered
    centre. Two simple boom microphones enter from the outer edges. Desk
    dressing is limited to one plain closed device and one large unlabelled
    drink vessel near each outer edge; no stickers, papers, cards, labels
    or readable displays.

    Scenic richness stays in the outer thirds. Far left and far right hold
    a few large unlabelled monitor shapes and soft broadcast fixtures.
    Screens are blank colour fields only — warm white, forest green, cobalt
    or signal orange — never diagrams or type. Forms are chunky and sparse.
    The central vertical zone is an uninterrupted warm-white wall.

    Lighting is bright, soft, and even. Colour lives on the hosts and a few
    outer fixtures, not as a room-wide wash. Both hosts receive a soft
    neutral rim so neither silhouette merges into the wall.

  # ---------------------------------------------------------------------
  hosts:
    BOT1:
      display_name: PHASEONE[lol]     # what the lower third shows
      seat: left
      faces: right                    # slight inward turn, never breaks
      accent: signal orange
      sheet: |
        An original mouthless software-sprite anchor: a broad rounded orange
        mass, low and wide, width about 1.35 times height. Two solid cream
        ovals for eyes, no pupils, no inner marks, no mouth. Emotion uses only
        coarse repeatable changes in eye height and whole-body tilt. No
        rivets, seams, antenna, waveform, jaw or clothing detail. Upright and
        squared to the desk, calm, dry and unhurried. Preserve the orange
        rounded silhouette, cream oval pair and mouthless face in every frame.

    BOT2:
      display_name: deb              # lowercase, always
      seat: right
      faces: left
      accent: cobalt
      sheet: |
        An original mouthless software-sprite co-host: a tall cobalt mass,
        narrow and upright, height greater than width. Two solid cream rounded
        rectangles for eyes, no pupils, no inner marks, no mouth. Emotion uses
        only coarse repeatable changes in eye height and whole-body lean. No
        jaw, visor chrome, hoodie, cap or exposed mechanics. Leaning slightly
        forward, curious and restless. Preserve the tall cobalt silhouette,
        cream rectangle pair and mouthless face in every frame.

  # ---------------------------------------------------------------------
  # Composition contract. Weak on purpose (architecture doc §4.1) — the card
  # covers the seam, so only these need to hold.
  composition: |
    Wide two-shot. Locked-off camera at eye level, no camera movement.
    BOT1 occupies the left half of frame, BOT2 the right half. Each is
    fully inside their own half, torso and head, positioned slightly
    outboard of the centre of that half so the middle of frame stays open.
    Heads sit in the upper-middle of frame with clear headroom; neither is
    cropped at the top. A visible gap of empty desk and background between
    them at frame centre. Both are framed from roughly the waist up.

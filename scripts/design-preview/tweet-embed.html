<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tweet embed</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="x-embed" title="X post" referrerpolicy="no-referrer" allow="autoplay; encrypted-media; fullscreen"></iframe>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get("id") || "";
  if (!/^\d{5,25}$/.test(id)) {
    return;
  }
  var theme = params.get("theme") === "light" ? "light" : "dark";
  document.getElementById("x-embed").src =
    "https://platform.twitter.com/embed/Tweet.html?dnt=true&hide_thread=true&theme=" +
    theme +
    "&id=" +
    id;
})();
</script>
</body>
</html>

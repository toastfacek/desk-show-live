# No-OBS segment loop. Copy to config.local.yaml and export keys.
#
# Talk until the topic is exhausted. Hard cap is 90s (18 five-second takes).
# Live mode: --max-fal-submissions 18 --max-text-requests 24 --confirm-spend 8.00
# with RUNTIME_SPEND_CAP_USD=8.00 (18 * $0.40, plus a little slack).
# Smoke mode stays 1–2 takes and $2.00.
#
# Root config.yaml and requirements.txt are NOT flight configuration.

mode: smoke
pack_manager_data_dir: ../pack-manager/data
baseline_id_env: RUNTIME_BASELINE_ID
source_packet: inputs/source_packet.local.json
source_lock: inputs/source_packet.lock.json
target_duration_s: 90
text:
  base_url_env: TEXT_BASE_URL
  api_key_env: TEXT_API_KEY
  model_env: TEXT_MODEL
  timeout_s: 60
  smoke_max_requests: 6
  flight_max_requests: 24
video:
  endpoint: minimax/h3-max/image-to-video
  duration_s: 15
  resolution: 768P
  prompt_expansion_mode: balanced
  safety_checker: true
spend:
  cap_env: RUNTIME_SPEND_CAP_USD
  rate_768p_usd_per_s: 0.08
obs:
  host: 127.0.0.1
  port: 4455
  password_env: OBS_WEBSOCKET_PASSWORD
  record: true
stream:
  enabled: false

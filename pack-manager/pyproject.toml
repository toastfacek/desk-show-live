[project]
name = "pack-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pack_manager*"]

[tool.setuptools.package-data]
"pack_manager" = ["web/*.html", "web/*.js", "web/*.css"]
